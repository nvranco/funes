{# Banner del panel (el de la landing): la marca de Funes a la izquierda y, si la pagina tiene una libreria, su
   nombre a la derecha. Lo usan el panel, el admin y las pantallas de inventario y catalogos. #}
<header class="banner-panel">
  <div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-1" style="min-height: 56px; padding: 0 1rem;">
    <div class="flex items-center gap-2">
      <span class="marca">
        <span class="nombre-marca">Funes</span>
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="16" cy="16" r="13"  stroke-dasharray="65.8 15.9" transform="rotate(-125 16 16)"/>
          <circle cx="16" cy="16" r="9.3" stroke-dasharray="47.1 11.4" transform="rotate(-5 16 16)"/>
          <circle cx="16" cy="16" r="5.6" stroke-dasharray="28.4 6.8"  transform="rotate(115 16 16)"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="text-tinta/70 text-sm font-medium ml-1">Admin</span>
    </div>
    {% if libreria is defined and libreria %}<p class="text-lg font-semibold text-tinta">{{ libreria.nombre }}</p>{% endif %}
  </div>
</header>
