{% extends "base.html" %}
{% block titulo %}Ingresando · Funes{% endblock %}
{% block head %}
{% include "_estilo_panel.html" %}
{% endblock %}
{% block contenido %}
<main class="min-h-screen flex items-center justify-center px-5">
  <p class="text-gris">Un momento…</p>
</main>
{% include "_clerk_js.html" %}
<script>
  // Vuelta de Google: Clerk cierra el inicio de sesión (o crea la cuenta) y sigue al destino guardado.
  (async () => {
    let destino = '/ingresar/destino';
    try { destino = sessionStorage.getItem('funes_destino') || destino; } catch (e) {}
    try {
      const clerk = await clerkListo();
      await clerk.handleRedirectCallback({
        signInForceRedirectUrl: destino, signUpForceRedirectUrl: destino,
        signInFallbackRedirectUrl: destino, signUpFallbackRedirectUrl: destino,
      });
    } catch (e) {
      location.replace('/ingresar');
    }
  })();
</script>
{% endblock %}
